[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:celery-worker]
command=celery -A celery_worker worker --loglevel=info --concurrency=4 -Q default,high_priority,media,sync,notifications,analytics,long_running,export
directory=/app/backend
user=app
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=600
stdout_logfile=/var/log/celery-worker.log
stderr_logfile=/var/log/celery-worker-error.log
environment=PATH="/usr/local/bin:%(ENV_PATH)s"

[program:celery-beat]
command=celery -A celery_worker beat --loglevel=info
directory=/app/backend
user=app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/var/log/celery-beat.log
stderr_logfile=/var/log/celery-beat-error.log
environment=PATH="/usr/local/bin:%(ENV_PATH)s"

[program:celery-flower]
command=celery -A celery_worker flower --port=5555 --basic_auth=admin:password
directory=/app/backend
user=app
autostart=true
autorestart=true
startsecs=10
stdout_logfile=/var/log/celery-flower.log
stderr_logfile=/var/log/celery-flower-error.log
environment=PATH="/usr/local/bin:%(ENV_PATH)s"