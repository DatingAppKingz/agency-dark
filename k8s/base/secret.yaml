apiVersion: v1
kind: Secret
metadata:
  name: agency-backend-secret
  namespace: agency
  labels:
    app: agency-backend
type: Opaque
stringData:
  # Database
  database-url: "postgresql://agency:CHANGE_ME@postgres-service:5432/agency_prod"
  
  # Redis
  redis-url: "redis://:CHANGE_ME@redis-service:6379/0"
  
  # Application secrets
  secret-key: "CHANGE_ME_TO_RANDOM_SECRET_KEY"
  
  # JWT secrets
  jwt-secret-key: "CHANGE_ME_TO_RANDOM_JWT_KEY"
  jwt-refresh-secret-key: "CHANGE_ME_TO_RANDOM_JWT_REFRESH_KEY"
  
  # AWS credentials (optional)
  aws-access-key-id: ""
  aws-secret-access-key: ""
  
  # Email credentials
  smtp-username: ""
  smtp-password: ""
  
  # External API keys
  openai-api-key: ""
  stripe-api-key: ""
  stripe-webhook-secret: ""
  
  # OAuth credentials
  google-client-id: ""
  google-client-secret: ""
  github-client-id: ""
  github-client-secret: ""
  
  # Monitoring
  sentry-dsn: ""
  datadog-api-key: ""
  
  # Encryption keys
  encryption-key: "CHANGE_ME_TO_32_BYTE_KEY"
  
  # Admin credentials
  admin-email: "admin@agency.com"
  admin-password: "CHANGE_ME_TO_SECURE_PASSWORD"