apiVersion: v1
kind: Service
metadata:
  name: agency-backend
  namespace: agency
  labels:
    app: agency-backend
    component: backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: http
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: arn:aws:acm:region:account-id:certificate/cert-id
    service.beta.kubernetes.io/aws-load-balancer-ssl-ports: "https"
spec:
  type: ClusterIP
  selector:
    app: agency-backend
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: agency-backend-nodeport
  namespace: agency
  labels:
    app: agency-backend
    component: backend
spec:
  type: NodePort
  selector:
    app: agency-backend
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
    nodePort: 30080