apiVersion: v1
kind: ServiceAccount
metadata:
  name: agency-backend
  namespace: agency
  labels:
    app: agency-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agency-backend-role
  namespace: agency
  labels:
    app: agency-backend
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agency-backend-rolebinding
  namespace: agency
  labels:
    app: agency-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agency-backend-role
subjects:
- kind: ServiceAccount
  name: agency-backend
  namespace: agency