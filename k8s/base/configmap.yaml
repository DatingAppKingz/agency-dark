apiVersion: v1
kind: ConfigMap
metadata:
  name: agency-backend-config
  namespace: agency
  labels:
    app: agency-backend
data:
  # Application settings
  APP_NAME: "Agency Backend"
  APP_VERSION: "1.0.0"
  
  # Server configuration
  UVICORN_HOST: "0.0.0.0"
  UVICORN_PORT: "8000"
  UVICORN_WORKERS: "1"
  
  # Database settings
  DB_POOL_SIZE: "20"
  DB_POOL_MAX_OVERFLOW: "40"
  DB_POOL_TIMEOUT: "30"
  
  # Redis settings
  REDIS_POOL_SIZE: "10"
  REDIS_DECODE_RESPONSES: "true"
  
  # CORS settings
  CORS_ORIGINS: "*"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_ALLOW_METHODS: "*"
  CORS_ALLOW_HEADERS: "*"
  
  # Rate limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_DEFAULT: "100/minute"
  RATE_LIMIT_BURST: "200"
  
  # Monitoring
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  TRACING_SAMPLE_RATE: "0.1"
  
  # Feature flags
  FEATURE_ANALYTICS: "true"
  FEATURE_ML_INSIGHTS: "true"
  FEATURE_WEBHOOKS: "true"
  
  # External services
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "agency-uploads"
  
  # Email settings
  EMAIL_BACKEND: "smtp"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USE_TLS: "true"
  
  # Celery settings
  CELERY_BROKER_URL: "redis://redis-service:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis-service:6379/1"
  CELERY_TASK_ALWAYS_EAGER: "false"
  CELERY_TASK_EAGER_PROPAGATES: "true"
  
  # Security
  SECURE_SSL_REDIRECT: "true"
  SESSION_COOKIE_SECURE: "true"
  CSRF_COOKIE_SECURE: "true"
  
  # Logging
  LOG_FORMAT: "json"
  LOG_LEVEL: "INFO"
  
  # Health check
  HEALTH_CHECK_DB_ENABLED: "true"
  HEALTH_CHECK_REDIS_ENABLED: "true"
  HEALTH_CHECK_STORAGE_ENABLED: "true"