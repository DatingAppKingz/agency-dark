apiVersion: v1
kind: Secret
metadata:
  name: agencydark-secret
  namespace: agencydark
type: Opaque
stringData:
  DATABASE_URL: "postgresql://agencydark:CHANGE_ME@postgres:5432/agencydark"
  REDIS_URL: "redis://redis:6379/0"
  SECRET_KEY: "CHANGE_ME_TO_SECURE_SECRET_KEY"
  INFLOW_API_KEY: "CHANGE_ME"
  ONLYFANS_API_KEY: "CHANGE_ME"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USER: "noreply@agencydark.com"
  SMTP_PASSWORD: "CHANGE_ME"
  SMTP_FROM: "noreply@agencydark.com"