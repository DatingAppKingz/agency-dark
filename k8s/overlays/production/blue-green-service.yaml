apiVersion: v1
kind: Service
metadata:
  name: agency-backend-blue
  namespace: production
spec:
  selector:
    app: agency-backend
    deployment: blue
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: agency-backend-green
  namespace: production
spec:
  selector:
    app: agency-backend
    deployment: green
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: agency-backend
  namespace: production
  annotations:
    kubernetes.io/description: "Main service that routes traffic to blue or green deployment"
spec:
  selector:
    app: agency-backend
    deployment: blue  # Default to blue, will be switched during deployment
  ports:
    - port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP