apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-backend-blue
  namespace: production
  labels:
    app: agency-backend
    deployment: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: agency-backend
      deployment: blue
  template:
    metadata:
      labels:
        app: agency-backend
        deployment: blue
    spec:
      containers:
      - name: backend
        image: agency/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DEPLOYMENT_COLOR
          value: "blue"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agency-backend-secret
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: agency-backend-secret
              key: redis-url
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agency-backend-green
  namespace: production
  labels:
    app: agency-backend
    deployment: green
spec:
  replicas: 0  # Initially scaled to 0, will be scaled up during deployment
  selector:
    matchLabels:
      app: agency-backend
      deployment: green
  template:
    metadata:
      labels:
        app: agency-backend
        deployment: green
    spec:
      containers:
      - name: backend
        image: agency/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DEPLOYMENT_COLOR
          value: "green"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: agency-backend-secret
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: agency-backend-secret
              key: redis-url
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5