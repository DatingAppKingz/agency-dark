apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: agencydark-ingress
  namespace: agencydark
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/cors-enable: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.agencydark.com"
spec:
  tls:
  - hosts:
    - api.agencydark.com
    secretName: agencydark-tls
  rules:
  - host: api.agencydark.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 8000