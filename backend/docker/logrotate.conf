# Logrotate configuration for AgencyDark

/app/logs/*.log {
    # Rotate daily
    daily
    
    # Keep 30 days of logs
    rotate 30
    
    # Compress rotated logs
    compress
    delaycompress
    
    # Don't rotate empty logs
    notifempty
    
    # Create new log files with proper permissions
    create 0666 appuser appgroup
    
    # Continue writing to the same file
    copytruncate
    
    # Don't fail if log is missing
    missingok
    
    # Size-based rotation (in addition to daily)
    size 100M
    
    # Date extension for rotated files
    dateext
    dateformat -%Y%m%d
    
    # Run post-rotation script
    postrotate
        # Send SIGUSR1 to the application to reopen log files
        if [ -f /app/app.pid ]; then
            kill -USR1 $(cat /app/app.pid) 2>/dev/null || true
        fi
    endscript
}

# Specific configuration for error logs
/app/logs/error.log {
    daily
    rotate 60  # Keep 60 days of error logs
    compress
    delaycompress
    notifempty
    create 0666 appuser appgroup
    copytruncate
    missingok
    size 50M
    dateext
    dateformat -%Y%m%d
}

# Access logs (if using file-based access logging)
/app/logs/access.log {
    daily
    rotate 7  # Keep only 7 days of access logs
    compress
    delaycompress
    notifempty
    create 0666 appuser appgroup
    copytruncate
    missingok
    size 200M
    dateext
    dateformat -%Y%m%d
}

# ML training logs
/app/logs/ml_*.log {
    weekly
    rotate 12  # Keep 12 weeks
    compress
    delaycompress
    notifempty
    create 0666 appuser appgroup
    copytruncate
    missingok
    size 500M
    dateext
    dateformat -%Y%m%d
}

# Monitoring logs
/app/logs/monitoring.log {
    daily
    rotate 14  # Keep 14 days
    compress
    delaycompress
    notifempty
    create 0666 appuser appgroup
    copytruncate
    missingok
    size 100M
    dateext
    dateformat -%Y%m%d
}