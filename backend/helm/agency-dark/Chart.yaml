apiVersion: v2
name: agency-dark
description: A Helm chart for Agency Dark backend deployment
type: application
version: 0.1.0
appVersion: "1.0.0"
keywords:
  - agency
  - backend
  - api
home: https://github.com/yourusername/agency-dark
sources:
  - https://github.com/yourusername/agency-dark
maintainers:
  - name: Your Name
    email: your.email@example.com
dependencies:
  - name: postgresql
    version: 12.1.0
    repository: https://charts.bitnami.com/bitnami
    condition: postgresql.enabled
  - name: redis
    version: 17.3.0
    repository: https://charts.bitnami.com/bitnami
    condition: redis.enabled