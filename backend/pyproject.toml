[tool.poetry]
name = "agency-dark-backend"
version = "1.0.0"
description = "Agency Dark - Advanced OnlyFans Agency Management Platform"
authors = ["Agency Dark Team <dev@agencydark.com>"]
license = "Proprietary"
readme = "README.md"
homepage = "https://agencydark.com"
repository = "https://github.com/agency-dark/backend"
documentation = "https://docs.agencydark.com"
keywords = ["agency", "management", "onlyfans", "api", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: FastAPI",
]

[tool.poetry.dependencies]
python = "^3.11"
# Core Framework
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = {extras = ["email"], version = "^2.5.0"}
pydantic-settings = "^2.1.0"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.23"}
alembic = "^1.12.1"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.9"

# Authentication & Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.6"
cryptography = "^41.0.7"

# API & HTTP
httpx = "^0.25.2"
aiohttp = "^3.9.1"
requests = "^2.31.0"

# Caching & Message Queue
redis = "^5.0.1"
celery = {extras = ["redis"], version = "^5.3.4"}
flower = "^2.0.1"

# File Processing
python-magic = "^0.4.27"
pillow = "^10.1.0"
opencv-python = "^4.8.1"
aiofiles = "^23.2.1"

# Cloud Storage
boto3 = "^1.34.0"
google-cloud-storage = "^2.13.0"

# Monitoring & Logging
sentry-sdk = {extras = ["fastapi"], version = "^1.39.1"}
prometheus-client = "^0.19.0"
opentelemetry-api = "^1.21.0"
opentelemetry-sdk = "^1.21.0"
opentelemetry-instrumentation-fastapi = "^0.43b0"
structlog = "^23.2.0"

# Email & Notifications
aiosmtplib = "^3.0.1"
twilio = "^8.10.3"
firebase-admin = "^6.3.0"
aioapns = "^3.1"
pywebpush = "^1.14.0"

# Data Processing & ML
pandas = "^2.1.4"
numpy = "^1.26.2"
scikit-learn = "^1.3.2"
joblib = "^1.3.2"

# Visualization & Reports
matplotlib = "^3.8.2"
seaborn = "^0.13.0"
reportlab = "^4.0.8"
openpyxl = "^3.1.2"

# Task Scheduling
croniter = "^2.0.1"
cron-descriptor = "^1.4.0"
apscheduler = "^3.10.4"

# API Documentation
slowapi = "^0.1.9"

# Payment Processing
stripe = "^7.9.0"

# Testing
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
respx = "^0.20.0"
faker = "^21.0.0"

# Development Tools
black = "^23.12.0"
isort = "^5.13.2"
flake8 = "^6.1.0"
mypy = "^1.7.1"
pre-commit = "^3.6.0"
bandit = {extras = ["toml"], version = "^1.7.5"}
safety = "^3.0.1"

# Additional Utilities
python-dotenv = "^1.0.0"
pytz = "^2023.3"
dateparser = "^1.2.0"
pyyaml = "^6.0.1"
orjson = "^3.9.10"
ujson = "^5.9.0"
websockets = "^12.0"
jinja2 = "^3.1.2"
click = "^8.1.7"
rich = "^13.7.0"
typer = "^0.9.0"

# Security Scanning
clamd = "^1.0.2"

# Performance
uvloop = {version = "^0.21.0", markers = "sys_platform != 'win32'"}
httptools = "^0.6.1"
user-agents = "^2.2.0"
geoip2 = "^5.1.0"
xgboost = "^3.0.3"
elasticsearch = "^9.1.0"
xlsxwriter = "^3.2.5"

[tool.poetry.group.dev.dependencies]
pytest-env = "^1.1.3"
pytest-xdist = "^3.5.0"
pytest-timeout = "^2.2.0"
pytest-benchmark = "^4.0.0"
locust = "^2.19.1"
notebook = "^7.0.6"
ipython = "^8.18.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_third_party = ["fastapi", "pydantic", "sqlalchemy"]
skip_glob = ["*/migrations/*"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--ignore=docs",
    "--ignore=setup.py",
    "--ignore=ci",
    "--ignore=.eggs",
    "--doctest-modules",
    "--doctest-glob=*.md",
    "--tb=short",
    "--cov=.",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
testpaths = ["tests"]
pythonpath = ["."]
env = [
    "ENVIRONMENT=test",
    "DATABASE_URL=postgresql://test:test@localhost:5432/test_db",
]

[tool.coverage.run]
source = ["."]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/virtualenv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
targets = ["."]
exclude_dirs = ["tests", "migrations"]
skips = ["B101", "B601"]

[tool.poetry.scripts]
start = "uvicorn main:app --reload"
migrate = "alembic upgrade head"
makemigrations = "alembic revision --autogenerate"
test = "pytest"
lint = "black . && isort . && flake8 . && mypy ."
security = "bandit -r . && safety check"