groups:
  - name: infrastructure_alerts
    interval: 30s
    rules:
      # Database Alerts
      - alert: PostgreSQLDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "PostgreSQL is down"
          description: "Cannot connect to PostgreSQL database"
          runbook_url: "https://docs.agencydark.com/runbooks/postgres-down"

      - alert: DatabaseConnectionPoolExhausted
        expr: pg_stat_database_numbackends{datname="agencydark_prod"} / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Database connection pool near limit"
          description: "{{ $value | humanizePercentage }} of connections used"

      - alert: DatabaseSlowQueries
        expr: rate(pg_stat_statements_mean_time_seconds{datname="agencydark_prod"}[5m]) > 0.5
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Database queries are slow"
          description: "Average query time is {{ $value }}s"

      - alert: DatabaseReplicationLag
        expr: pg_replication_lag > 10
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Database replication lag detected"
          description: "Replication lag is {{ $value }} seconds"

      # Redis Alerts
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Redis is down"
          description: "Cannot connect to Redis server"

      - alert: RedisHighMemoryUsage
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis is using {{ $value | humanizePercentage }} of available memory"

      - alert: RedisHighKeyEviction
        expr: rate(redis_evicted_keys_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "High Redis key eviction rate"
          description: "{{ $value }} keys evicted per second"

      # Disk Alerts
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.1
        for: 5m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "Low disk space on root partition"
          description: "Only {{ $value | humanizePercentage }} disk space remaining"

      - alert: DiskIOHigh
        expr: rate(node_disk_io_time_seconds_total[5m]) > 0.9
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High disk I/O utilization"
          description: "Disk I/O is at {{ $value | humanizePercentage }}"

      # Memory Alerts
      - alert: SystemMemoryLow
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.9
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "System memory usage is high"
          description: "{{ $value | humanizePercentage }} of memory is used"

      - alert: SystemSwapUsage
        expr: (node_memory_SwapTotal_bytes - node_memory_SwapFree_bytes) > 0
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "System is using swap memory"
          description: "{{ $value | humanizeBytes }} of swap is being used"

      # CPU Alerts
      - alert: SystemCPUHigh
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "System CPU usage is high"
          description: "CPU usage is at {{ $value }}%"

      # Network Alerts
      - alert: NetworkErrorsHigh
        expr: rate(node_network_receive_errs_total[5m]) + rate(node_network_transmit_errs_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "High network error rate"
          description: "{{ $value }} network errors per second"

      # Docker Alerts
      - alert: DockerContainerDown
        expr: engine_daemon_container_states_containers{state="stopped"} > 0
        for: 5m
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "Docker container is down"
          description: "{{ $value }} container(s) are stopped"

      # Certificate Alerts
      - alert: SSLCertificateExpiringSoon
        expr: probe_ssl_earliest_cert_expiry - time() < 86400 * 30
        for: 24h
        labels:
          severity: warning
          team: infrastructure
        annotations:
          summary: "SSL certificate expiring soon"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"

      - alert: SSLCertificateExpired
        expr: probe_ssl_earliest_cert_expiry - time() < 0
        for: 1m
        labels:
          severity: critical
          team: infrastructure
        annotations:
          summary: "SSL certificate has expired"
          description: "Certificate for {{ $labels.instance }} has expired"