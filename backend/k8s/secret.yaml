apiVersion: v1
kind: Secret
metadata:
  name: agency-dark-secret
  namespace: agency-dark
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql+asyncpg://postgres:CHANGE_ME@postgres-service:5432/agencydark"
  POSTGRES_PASSWORD: "CHANGE_ME"
  
  # Redis
  REDIS_URL: "redis://:CHANGE_ME@redis-service:6379/0"
  REDIS_PASSWORD: "CHANGE_ME"
  
  # RabbitMQ
  RABBITMQ_URL: "amqp://admin:CHANGE_ME@rabbitmq-service:5672/agencydark"
  RABBITMQ_PASSWORD: "CHANGE_ME"
  
  # Security
  SECRET_KEY: "CHANGE_ME_GENERATE_SECURE_KEY"
  JWT_SECRET: "CHANGE_ME_GENERATE_SECURE_JWT_SECRET"
  
  # AWS (for S3 storage)
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_S3_BUCKET: "agency-dark-uploads"
  AWS_REGION: "us-east-1"
  
  # Payment providers
  STRIPE_API_KEY: "CHANGE_ME"
  STRIPE_WEBHOOK_SECRET: "CHANGE_ME"
  COINBASE_API_KEY: "CHANGE_ME"
  COINBASE_WEBHOOK_SECRET: "CHANGE_ME"
  
  # Monitoring
  SENTRY_DSN: "CHANGE_ME"
  
  # Email
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_PORT: "587"
  SMTP_USER: "apikey"
  SMTP_PASSWORD: "CHANGE_ME"