[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto

# Markers
markers =
    unit: Unit tests
    integration: Integration tests  
    contract: Contract tests
    performance: Performance tests
    security: Security tests
    slow: Tests that take a long time
    benchmark: Benchmark tests
    load: Load tests
    mutation: Mutation tests

# Coverage options
addopts = 
    --strict-markers
    --tb=short
    --cov=backend
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=80
    -v

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests
timeout = 300

# Parallel execution
# -n auto for automatic CPU count detection
# addopts = -n 4

# Test output
console_output_style = progress

# Benchmark options
benchmark_only = false
benchmark_skip = false
benchmark_disable = false
benchmark_save = .benchmarks
benchmark_compare = 0001
benchmark_autosave = true
benchmark_max_time = 1.0
benchmark_min_rounds = 5
benchmark_calibration_precision = 10

# Mutation testing
mutmut_config = .mutmut.conf