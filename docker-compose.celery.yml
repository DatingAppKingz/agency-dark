version: '3.8'

services:
  # Celery worker for general tasks
  celery-worker:
    build: .
    command: celery -A celery_worker worker --loglevel=info --concurrency=4 -Q default,high_priority,analytics,notifications,sync,financial
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend
      - ./exports:/app/exports
      - ./reports:/app/reports
    restart: unless-stopped

  # Celery worker for media processing
  celery-media-worker:
    build: .
    command: celery -A celery_worker worker --loglevel=info --concurrency=2 -Q media
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend
      - ./media:/app/media
      - /tmp:/tmp
    restart: unless-stopped

  # Celery worker for long-running tasks
  celery-long-worker:
    build: .
    command: celery -A celery_worker worker --loglevel=info --concurrency=1 -Q long_running,export
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend
      - ./exports:/app/exports
    restart: unless-stopped

  # Celery beat scheduler
  celery-beat:
    build: .
    command: celery -A celery_worker beat --loglevel=info
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  # Celery Flower for monitoring
  celery-flower:
    build: .
    command: celery -A celery_worker flower --port=5555 --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL}
      - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
    depends_on:
      - redis
      - celery-worker
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  # ClamAV for virus scanning
  clamav:
    image: clamav/clamav:latest
    restart: unless-stopped
    volumes:
      - clamav-db:/var/lib/clamav
    ports:
      - "3310:3310"

volumes:
  clamav-db: